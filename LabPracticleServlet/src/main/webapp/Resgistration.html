<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Registration Form</title>
</head>
<body>

<h1>Registration Form</h1>

<form action="RegisterServlet"  method="post">
<table border="1">

<tr>
    <td>Name :</td>
    <td><input type="text" placeholder="Enter Name" name="name" required></td>
</tr>

<tr>
    <td>Username :</td>
    <td><input type="text" placeholder="Enter Username" name="uname" required></td>
</tr>

<tr>
    <td>Password :</td>
    <td><input type="password" placeholder="Enter Password" name="upass" required></td>
</tr>

<tr>
    <td>Contact :</td>
    <td><input type="number" name="contact"></td>
</tr>

<tr>
    <td>
        <button type="submit">Register</button>
    </td>
</tr>

</table>
</form>

</body>
</html>
