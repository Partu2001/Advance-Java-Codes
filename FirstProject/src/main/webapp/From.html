<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Student Form</title>
</head>
<body>
<h1>Student Form</h1>
<form action="From" method="post">
   Name : <input type="text" placeholder="Enter Name" name="name"> <br> <br>
   Email : <input type="email" placeholder="Enter Email" name="email"> <br> <br>
   Contact : <input type="number" placeholder="Enter Number" name="contact"> <br> <br>
   Gender : <input type="radio" name="gender" value="Male"> Male
    <input type="radio" name="gender" value="Female">Female
    <input type="radio" name="gender" value="Other">Other
     <br> <br>
    City : <select name="city">
    <option value="Kolhapur">Kolhapur</option>
    <option value="Sangli">Sangli</option>
    <option value="Pune">Pune</option>
    <option value="Mumbai">Mumbai</option>
    <option value="Kokan">Kokan</option>
    </select> <br> <br>
    Subject : <input type="checkbox" name="subject" value="English">English
    <input type="checkbox" name="subject" value="Maths">Maths
    <input type="checkbox" name="subject" value="Science">Science
     <input type="checkbox" name="subject" value="Marathi">Marathi
      <input type="checkbox" name="subject" value="History">History
     <br> <br>
    <button type="submit">Submit</button>
    
</form>

</body>
</html>
